<script>window.MR_BUILD="dev"</script><script src="watch.js"></script><script src="config.js"></script><script src="core.js"></script><script src="store.js"></script><script src="owner.js"></script><script src="cust.js"></script><script src="galla.js"></script><script src="team.js"></script><script src="remind.js"></script><script src="talk.js"></script><script src="phone.js"></script><script src="kaam.js"></script><script src="sath.js"></script>
<script>
/* मारवाड़ रसोई — मैनेजर / वेटर / डायरेक्टर ऐप (चरण 1+2) — नियम: docs/मारवाड़-रसोई-ऐप-प्रॉम्प्ट.txt */
let ME = LS.get("mr_me", null), TAB = "orders", ALL = [], SIL = {}, TAKE = { type: "table", table: 0, cart: {}, note: "" };
const ROLES = { owner: "डायरेक्टर", manager: "मैनेजर", waiter: "वेटर", kitchen: "वाइस शेफ" };
const WAIT = (CFG.ownerWait || 180) * 1000;
const isLate = o => o.status === "new" && now() - o.ts > WAIT;
const todays = () => ALL.filter(o => o.ts >= today0());
const pend = () => todays().filter(o => o.status === "new");
/* किसके फोन पर घंटी: मैनेजर/वेटर — हर नया; डायरेक्टर — सिर्फ़ वे जो 3 मिनट से अटके हैं */

function login() {
  const b = sheet(`<h3>👋 कौन चला रहा है?</h3><input class="in" id="ln" placeholder="आपका नाम" value="${E(ME ? ME.name : CFG.manager.name)}">
  <div class="seg" id="lr">${Object.keys(ROLES).map(r => `<button data-r="${r}" class="${(ME ? ME.role : "manager") === r ? "on" : ""}">${ROLES[r]}</button>`).join("")}</div>
  <button class="btn big" id="lgo">शुरू करें</button>`);
  let role = ME ? ME.role : "manager";
  b.onclick = e => { const r = e.target.closest("[data-r]"); if (r) { role = r.dataset.r; $$("#lr button", b).forEach(x => x.classList.toggle("on", x === r)) }
    if (e.target.id === "lgo") { const n = $("#ln", b).value.trim(); if (!n) return toast("नाम लिखें"); ME = { name: n, role }; LS.set("mr_me", ME); closeSheet(); BELL.beep(); draw() } };
}
const act = (id, p) => DB.upd(id, p, ME.name).catch(e => toast("सेव नहीं हुआ — नेट देखें"));
const card = o => {
  const s = ST[o.status], late = isLate(o), isCall = o.kind === "call";
  const btn = isCall ? (o.status === "new" ? `<button class="btn ok" data-a="done" data-id="${o.id}">${o.call === "msg" ? "✔ पढ़ लिया" : ["store", "stin"].includes(o.call) ? "✔ देख लिया" : "✔ जा रहे हैं"}</button>` : "")

  <div class="kot">${(o.items || []).map(l => `<div><b>${l.q}×</b>${vmark(l.veg)}${E(title(l.n))}<span>${rs(l.q * l.s)}</span></div>`).join("")}${o.note ? `<div class="nt">📝 ${E(o.note)}</div>` : ""}</div>`}
  <div class="r3">${isCall ? "<span class='tot'></span>" : `<span class="tot">${rs(o.total)}</span>`}${btn}</div></div>`;
};
function vOrders() {

  const OK = T.filter(o => o.kind !== "call" && o.status !== "rej"), own = ME.role === "owner" ? `<div class="sum own"><div><b>${OK.length}</b><small>आज के ऑर्डर</small></div><div><b>${rs(OK.reduce((t, o) => t + (o.total || 0), 0))}</b><small>ऑर्डर की रकम</small></div><div><b>${T.filter(o => o.kind !== "call" && !o.tm && o.status === "done").length}</b><small>बिना TMBill नं.</small></div></div>` : "";

const tOpen = n => todays().filter(o => o.type === "table" && +o.table === n && !["done", "rej"].includes(o.status));
function vTables() {
  return `<div class="h">🍽️ टेबल <small>छूकर खोलें</small></div><div class="tg">${Array.from({ length: CFG.tables || 16 }, (_, k) => { const n = k + 1, L = tOpen(n), c = L.find(o => o.kind === "call" && o.status === "new"), ord = L.filter(o => o.kind !== "call");

}
function tableSheet(n) {
  const L = tOpen(n).sort((a, b) => a.ts - b.ts);
  const b = sheet(`<h3>🍽️ टेबल ${n}</h3>${L.map(card).join("") || `<div class="empty">यह टेबल खाली है</div>`}<button class="btn big" data-take="${n}">➕ इस टेबल का ऑर्डर लें</button>`);
  b.addEventListener("click", e => { const t = e.target.closest("[data-take]"); if (t) { TAKE.type = "table"; TAKE.table = n; closeSheet(); TAB = "take"; draw() } else onAct(e, () => tableSheet(n)) });
}
function vTake() {
  return `<div class="seg" id="ty">${[["table", "🍽️ टेबल"], ["parcel", "🥡 पार्सल"], ["delivery", "🛵 डिलीवरी"]].map(([k, l]) => `<button data-ty="${k}" class="${TAKE.type === k ? "on" : ""}">${l}</button>`).join("")}</div>
  ${TAKE.type === "table" ? `<div class="tsel">${Array.from({ length: CFG.tables || 16 }, (_, k) => `<button data-tn="${k + 1}" class="${TAKE.table === k + 1 ? "on" : ""}">${k + 1}</button>`).join("")}</div>` : ""}<div id="menu"></div>`;
}
function bar() {
  const b = $("#bar"), L = cartLines(TAKE.cart), n = L.reduce((t, l) => t + l.q, 0);
  b.hidden = !(TAB === "take" && n); if (!b.hidden) b.innerHTML = `<span>${n} डिश · ${rs(cartTotal(TAKE.cart))}</span><span>ऑर्डर देखें ›</span>`;
}
function review() {
  const L = cartLines(TAKE.cart); if (!L.length) return;
  if (TAKE.type === "table" && !TAKE.table) return toast("पहले टेबल चुनें");
  const b = sheet(`<h3>${where(TAKE)} — ऑर्डर पक्का करें</h3><div class="kot">${L.map(l => `<div><b>${l.q}×</b>${vmark(l.veg)}${E(title(l.n))}<span>${rs(l.q * l.s)}</span></div>`).join("")}</div>
  ${TAKE.type !== "table" ? `<input class="in" id="cn" placeholder="ग्राहक का नाम"><input class="in" id="cp" inputmode="numeric" maxlength="10" placeholder="मोबाइल नंबर">${TAKE.type === "delivery" ? `<input class="in" id="ca" placeholder="पता / क्वार्टर">` : ""}` : ""}
  <input class="in" id="nt" placeholder="नोट (कम तीखा, बिना प्याज़…)" value="${E(TAKE.note)}">
  <button class="btn ok big" id="send">✅ रसोई को भेजें · ${rs(cartTotal(TAKE.cart))}</button>`);
  $("#send", b).onclick = () => {
    const o = { kind: "order", type: TAKE.type, table: TAKE.type === "table" ? TAKE.table : 0, items: L, total: cartTotal(TAKE.cart), note: $("#nt", b).value.trim(), by: ME.name,
      name: ($("#cn", b) || {}).value || "", phone: (($("#cp", b) || {}).value || "").replace(/\D/g, ""), addr: ($("#ca", b) || {}).value || "" };
    if (TAKE.type === "delivery" && !o.addr) return toast("पता लिखें");
    if (ME.role === "saathi") { o.status = "new"; o.taker = ME.name } /* साथी का लिया ऑर्डर → मैनेजर स्वीकार करे (घंटी) */
    else { o.status = "acc"; o.eta = (CFG.prep || [25])[1] || 25 } /* वेटर का लिया ऑर्डर सीधा स्वीकार — घंटी नहीं */
    $("#send", b).disabled = true;
    DB.add(o).then(() => { TAKE = { type: TAKE.type, table: 0, cart: {}, note: "" }; closeSheet(); if (ME.role === "saathi") { LS.set("mr_my_orders", LS.get("mr_my_orders", []).filter(x => x.ts > today0()).concat([{ id: o.id, ts: now() }])); SMINE.t = 0; toast("✅ मैनेजर को भेज दिया"); TAB = "take" } else { toast("ऑर्डर रसोई में गया ✔"); TAB = "orders" } draw() }).catch(e => { $("#send", b).disabled = false; toast("नहीं गया — नेट देखें") });
  };
}
/* ☰ और (15-11 चरण B): लंबी लाइनों की जगह 3-कॉलम टाइल — आइकन + 1-2 शब्द + छोटा अंक; पद के हिसाब से ही टाइल दिखे */
const MORE = { ts: 0 };
function moreLoad() { if (now() - MORE.ts < 60000 || !ME || !["owner", "manager"].includes(ME.role)) return; MORE.ts = now();
  Promise.all([COL("udhar").list().catch(() => null), COL("galla").list().catch(() => null), ST8.ready ? null : storeLoad().catch(() => 0)]).then(([u, g]) => {
    if (u) MORE.ud = u.reduce((t, x) => t + Math.max(0, udDue(x)), 0); if (g) MORE.gl = gBal(g.filter(x => x.ts >= today0() - 864e5 * 400)); if (TAB === "more") draw() }) }
const tl = (a, ic, n, v, cls) => `<button class="mt ${cls || ""}" data-a="${a}"><i>${ic}</i><span>${n}</span>${v != null && v !== "" ? `<b>${v}</b>` : ""}</button>`;
const PAYM = [["cash", "💵", "नकद"], ["qr", "📲", "दुकान का QR"], ["udhar", "📒", "उधार"], ["paid", "✅", "पहले ही ऑनलाइन"]];
/* 🧾 आज के बिल (चरण D, सिर्फ़ डायरेक्टर): हर पूरा ऑर्डर — किसने बंद किया, TMBill नं., रकम, कैसे मिला; ऑर्डर से कम रकम / बिना नंबर / रद्द = लाल */
function billSheet() { const T = todays().filter(o => o.kind !== "call" && ["done", "rej"].includes(o.status)).reverse(), D = T.filter(o => o.status === "done"), by = {}, pm = {};
  D.forEach(o => { by[o.cby || o.by || "—"] = (by[o.cby || o.by || "—"] || 0) + (o.amt || 0); pm[o.pay || "?"] = (pm[o.pay || "?"] || 0) + (o.amt || 0) });
  const bad = o => o.status === "rej" || !o.tm || (o.amt || 0) < (o.total || 0) - 1, nb = T.filter(bad).length, PN = Object.fromEntries(PAYM.map(x => [x[0], x[1] + " " + x[2]]));
  sheet(`<h3>🧾 आज के बिल</h3><div class="sum"><div><b>${D.length}</b><small>बिल</small></div><div><b>${rs(D.reduce((t, o) => t + (o.amt || 0), 0))}</b><small>बिल की रकम</small></div><div><b style="${nb ? "color:#dc2626" : ""}">${nb}</b><small>ध्यान दें</small></div></div>
  <div class="h">💳 पैसा कैसे मिला</div><div class="kot">${Object.entries(pm).map(([k, v]) => `<div>${PN[k] || "❓ नहीं लिखा"}<span>${rs(v)}</span></div>`).join("") || "<div>—</div>"}</div>
  <div class="h">✍️ किसने बिल बंद किया</div><div class="kot">${Object.entries(by).map(([k, v]) => `<div>${E(k)}<span>${rs(v)}</span></div>`).join("") || "<div>—</div>"}</div>
  <div class="h">📋 सारे बिल</div>${T.map(o => `<div class="bl ${bad(o) ? "bad" : ""}"><span><b>${o.status === "rej" ? "❌ रद्द" : "🧾 " + E(o.tm || "बिना नंबर")}</b> · ${E(where(o))}<small>${hm(o.ts)} · ${E(o.cby || o.by || "")}${o.status === "rej" ? (o.why ? " · " + E(o.why) : "") : " · " + (PN[o.pay] || "❓")}${o.status === "done" && (o.amt || 0) < (o.total || 0) - 1 ? " · ऑर्डर " + rs(o.total) + " से कम!" : ""}</small></span><b>${rs(o.amt || o.total || 0)}</b></div>`).join("") || `<div class="empty">आज अभी कोई बिल बंद नहीं हुआ</div>`}
  <div class="h">🔍 TMBill से मिलान</div><p class="hint">TMBill से दिन/हफ़्ते की बिल-रिपोर्ट (CSV) निकालकर यहाँ चुनें — ऐप के बंद बिल उससे अपने-आप मिलेंगे।</p>
  <label class="btn gh big" style="display:block;text-align:center">📂 TMBill की फ़ाइल चुनें<input type="file" id="tmf" accept=".csv,text/csv" hidden></label><div id="tmr"></div>`);
  $("#tmf").onchange = async e => { const f = e.target.files[0]; if (!f) return; const out = $("#tmr"); out.innerHTML = `<div class="empty">⏳ मिला रहे हैं…</div>`; try { out.innerHTML = await tmMatch(await f.text()) } catch (x) { out.innerHTML = `<div class="err">${E(String(x.message || x))}</div>` } } }
/* 🔍 TMBill मिलान (चरण D): फ़ाइल के खाने अपने-आप पहचानें — बिल नंबर / रकम / तारीख; उन तारीखों के ऐप के "पूरे" ऑर्डर (tm, amt) से मिलाएँ */
async function tmMatch(txt) { const R = csvRows(txt), Hd = (R[0] || []).map(h => h.trim().toLowerCase()), fx = (...k) => Hd.findIndex(h => k.some(x => h.includes(x)));
  const iB = fx("bill no", "bill_no", "billno", "invoice", "bill"), iA = fx("grand", "net amount", "total", "amount", " rs", "rs"), iD = fx("date");
  if (iB < 0 || iA < 0) throw new Error("बिल नंबर / रकम के खाने नहीं मिले — TMBill की बिल-वार रिपोर्ट चुनें");
  const T = {}, ds = []; R.slice(1).forEach(r => { const b = String(r[iB] || "").trim().replace(/^0+/, ""); if (!b) return; T[b] = Math.round(+String(r[iA] || "").replace(/[^0-9.]/g, "") || 0); if (iD >= 0) { const d = Date.parse(String(r[iD]).trim().split(" ")[0].split("-").reverse().join("-")) || Date.parse(r[iD]); if (d) ds.push(d) } });
  const from = ds.length ? Math.min(...ds) - 864e5 : today0() - 7 * 864e5, to = ds.length ? Math.max(...ds) + 2 * 864e5 : now();
  const A = (FS_ON ? await fsQuery({ from: [{ collectionId: "orders" }], where: { fieldFilter: { field: { fieldPath: "ts" }, op: "GREATER_THAN_OR_EQUAL", value: { integerValue: String(Math.floor(from)) } } }, limit: 3000 }) : DB.all()).filter(o => o.kind !== "call" && o.ts <= to && o.status === "done");
  const miss = A.filter(o => !o.tm || T[String(o.tm).trim().replace(/^0+/, "")] == null), diff = A.filter(o => { const t = T[String(o.tm || "").trim().replace(/^0+/, "")]; return t != null && Math.abs(t - (o.amt || o.total || 0)) > 1 }), ok = A.length - miss.length - diff.length;
  const row = (o, w) => `<div class="bl bad"><span><b>🧾 ${E(o.tm || "बिना नंबर")}</b> · ${E(where(o))}<small>${new Date(o.ts).toLocaleDateString("en-IN", { day: "numeric", month: "short" })} ${hm(o.ts)} · ${E(o.cby || o.by || "")} · ${w}</small></span><b>${rs(o.amt || o.total || 0)}</b></div>`;
  return `<div class="sum"><div><b style="color:#15803d">${ok}</b><small>✅ मिल गए</small></div><div><b style="color:#dc2626">${miss.length}</b><small>❌ TMBill में नहीं</small></div><div><b style="color:#b45309">${diff.length}</b><small>⚠ रकम अलग</small></div></div>
  ${miss.map(o => row(o, "ऐप में बंद, पर यह नंबर TMBill में नहीं — पूछें")).join("")}${diff.map(o => row(o, "TMBill में " + rs(T[String(o.tm).trim().replace(/^0+/, "")]) + " — ऐप में " + rs(o.amt || o.total || 0))).join("")}
  <p class="hint">TMBill में कुल ${Object.keys(T).length} बिल · ऐप के ${A.length} ऑनलाइन/टेबल बिल जाँचे। काउंटर पर सीधे बने बिल ऐप में नहीं होते — वह ठीक है।</p>` }
