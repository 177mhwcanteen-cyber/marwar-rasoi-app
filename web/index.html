<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marwar Rasoi — मैनेजर</title><meta name="theme-color" content="#7a1c1c"><link rel="icon" href="icon.png"><link rel="stylesheet" href="app.css"></head><body>
<div class="top"><img class="lgo" src="icon.png" alt=""><div><h1>MARWAR RASOI</h1><small id="sub">Amenity Centre, Jalipa</small></div><button class="me" id="me">👤</button></div>
<div class="demo" id="demo" hidden>डेमो मोड — डेटा अभी सिर्फ़ इसी फोन में है (Firebase जुड़ते ही सब फोन पर चलेगा)</div>
<div class="pg" id="pg"></div>
<button class="bar" id="bar" hidden></button>
<div class="tabs" id="tabs"><button data-t="orders"><span>🔔</span>ऑर्डर<b id="nb" hidden></b></button><button data-t="tables"><span>🍽️</span>टेबल</button><button data-t="take"><span>➕</span>ऑर्डर लें</button><button data-t="store"><span>📦</span>स्टोर</button><button data-t="more"><span>☰</span>और</button></div>
<script src="config.js"></script><script src="core.js"></script><script src="store.js"></script><script src="owner.js"></script><script src="cust.js"></script>
<script>
/* मारवाड़ रसोई — मैनेजर / वेटर / मालिक ऐप (चरण 1+2) — नियम: docs/मारवाड़-रसोई-ऐप-प्रॉम्प्ट.txt */
let ME = LS.get("mr_me", null), TAB = "orders", ALL = [], SIL = {}, TAKE = { type: "table", table: 0, cart: {}, note: "" };
const ROLES = { owner: "मालिक", manager: "मैनेजर", waiter: "वेटर", kitchen: "रसोइया" };
const WAIT = (CFG.ownerWait || 180) * 1000;
const isLate = o => o.status === "new" && now() - o.ts > WAIT;
const todays = () => ALL.filter(o => o.ts >= today0());
const pend = () => todays().filter(o => o.status === "new");
/* किसके फोन पर घंटी: मैनेजर/वेटर — हर नया; मालिक — सिर्फ़ वे जो 3 मिनट से अटके हैं */
const ringFor = () => pend().filter(o => !SIL[o.id] && (ME && ME.role === "owner" ? isLate(o) : true));

function login() {
  const b = sheet(`<h3>👋 कौन चला रहा है?</h3><input class="in" id="ln" placeholder="आपका नाम" value="${E(ME ? ME.name : CFG.manager.name)}">
  <div class="seg" id="lr">${Object.keys(ROLES).map(r => `<button data-r="${r}" class="${(ME ? ME.role : "manager") === r ? "on" : ""}">${ROLES[r]}</button>`).join("")}</div>
  <button class="btn big" id="lgo">शुरू करें</button>`);
  let role = ME ? ME.role : "manager";
  b.onclick = e => { const r = e.target.closest("[data-r]"); if (r) { role = r.dataset.r; $$("#lr button", b).forEach(x => x.classList.toggle("on", x === r)) }
    if (e.target.id === "lgo") { const n = $("#ln", b).value.trim(); if (!n) return toast("नाम लिखें"); ME = { name: n, role }; LS.set("mr_me", ME); closeSheet(); BELL.beep(); draw() } };
}
const act = (id, p) => DB.upd(id, p, ME.name).catch(e => toast("सेव नहीं हुआ — नेट देखें"));
const card = o => {
  const s = ST[o.status], late = isLate(o), isCall = o.kind === "call";
  const btn = isCall ? (o.status === "new" ? `<button class="btn ok" data-a="done" data-id="${o.id}">${o.call === "msg" ? "✔ पढ़ लिया" : o.call === "store" ? "✔ देख लिया" : "✔ जा रहे हैं"}</button>` : "")
    : o.status === "new" ? `<button class="btn gh sm" data-a="rej" data-id="${o.id}">❌ मना</button><button class="btn ok" data-a="acc" data-id="${o.id}">✅ स्वीकार</button>`
    : o.status === "acc" ? `<button class="btn" data-a="cook" data-id="${o.id}">👨‍🍳 बनाना शुरू</button>`
    : o.status === "cook" ? `<button class="btn ok" data-a="out" data-id="${o.id}">${o.type === "table" ? "🍽️ परोस दिया" : o.type === "parcel" ? "🥡 दे दिया" : "🛵 निकल गया"}</button>`
    : o.status === "out" ? `<button class="btn" data-a="done" data-id="${o.id}">✔ पूरा + TMBill नं.</button>` : "";
  return `<div class="oc ${late ? "late" : ""}" style="--sc:${s.c}"><div class="r1"><span class="w">${isCall ? (["store", "msg"].includes(o.call) ? CALLS[o.call].ic + " " + CALLS[o.call].hi : CALLS[o.call].ic + " " + where(o).replace("🍽️ ", "") + " — " + CALLS[o.call].hi) : where(o)}</span><span class="pill">${s.hi}</span><span class="t">${hm(o.ts)} · ${mins(o.ts)} मि.</span></div>
  ${late ? `<div class="esc">⏱ ${Math.round(WAIT / 60000)} मिनट से ज़्यादा — मालिक को घंटी</div>` : ""}
  ${isCall ? (o.note ? `<div class="kot"><div class="nt" style="color:var(--ink)">${E(o.note)}</div></div><div class="who">✍️ ${E(o.by || "")}</div>` : "") : `${custTag(o.phone)}<div class="who">${o.by === "customer" ? "📱 ग्राहक ने खुद (QR)" : "✍️ " + E(o.by || "")}${o.name ? " · " + E(o.name) : ""}${o.phone ? " · 📞 " + E(o.phone) : ""}${o.addr ? " · 📍 " + E(o.addr) : ""}${o.eta && o.status !== "done" ? " · ⏳ ~" + o.eta + " मि." : ""}${o.tm ? " · 🧾 TMBill " + E(o.tm) : ""}</div>
  <div class="kot">${(o.items || []).map(l => `<div><b>${l.q}×</b>${vmark(l.veg)}${E(title(l.n))}<span>${rs(l.q * l.s)}</span></div>`).join("")}${o.note ? `<div class="nt">📝 ${E(o.note)}</div>` : ""}</div>`}
  <div class="r3">${isCall ? "<span class='tot'></span>" : `<span class="tot">${rs(o.total)}</span>`}${btn}</div></div>`;
};
function vOrders() {
  const T = todays(), g = st => T.filter(o => st.includes(o.status)).sort((a, b) => a.ts - b.ts);
  const N = g(["new"]), K = g(["acc", "cook"]), O = g(["out"]), D = g(["done", "rej"]).reverse();
  const OK = T.filter(o => o.kind !== "call" && o.status !== "rej"), own = ME.role === "owner" ? `<div class="sum own"><div><b>${OK.length}</b><small>आज के ऑर्डर</small></div><div><b>${rs(OK.reduce((t, o) => t + (o.total || 0), 0))}</b><small>ऑर्डर की रकम</small></div><div><b>${T.filter(o => o.kind !== "call" && !o.tm && o.status === "done").length}</b><small>बिना TMBill नं.</small></div></div>` : "";
  return `${own}${N.length ? `<div class="h">🔔 नए <small>${N.length}</small>${ringFor().length ? `<button class="btn gh sm" data-a="sil" style="margin-left:auto">🔕 चुप</button>` : ""}</div>${N.map(card).join("")}` : `<div class="empty">🔔 अभी कोई नया ऑर्डर नहीं</div>`}
  ${K.length ? `<div class="h">👨‍🍳 रसोई में <small>${K.length}</small></div>${K.map(card).join("")}` : ""}
  ${O.length ? `<div class="h">🍽️ परोसा / निकला <small>${O.length}</small></div>${O.map(card).join("")}` : ""}
  ${D.length ? `<div class="h">✔ आज के पूरे <small>${D.length}</small></div>${D.slice(0, 30).map(card).join("")}` : ""}`;
}
const tOpen = n => todays().filter(o => o.type === "table" && +o.table === n && !["done", "rej"].includes(o.status));
function vTables() {
  return `<div class="h">🍽️ टेबल <small>छूकर खोलें</small></div><div class="tg">${Array.from({ length: CFG.tables || 16 }, (_, k) => { const n = k + 1, L = tOpen(n), c = L.find(o => o.kind === "call" && o.status === "new"), ord = L.filter(o => o.kind !== "call");
    return `<button class="tb ${c ? "call" : ord.length ? "busy" : ""}" data-tb="${n}"><i>${n}</i><small>${c ? CALLS[c.call].hi : ord.length ? rs(ord.reduce((t, o) => t + o.total, 0)) : "खाली"}</small>${c ? `<em>${CALLS[c.call].ic}</em>` : ""}</button>` }).join("")}</div>`;
}
function tableSheet(n) {
  const L = tOpen(n).sort((a, b) => a.ts - b.ts);
  const b = sheet(`<h3>🍽️ टेबल ${n}</h3>${L.map(card).join("") || `<div class="empty">यह टेबल खाली है</div>`}<button class="btn big" data-take="${n}">➕ इस टेबल का ऑर्डर लें</button>`);
  b.addEventListener("click", e => { const t = e.target.closest("[data-take]"); if (t) { TAKE.type = "table"; TAKE.table = n; closeSheet(); TAB = "take"; draw() } else onAct(e, () => tableSheet(n)) });
}
function vTake() {
  return `<div class="seg" id="ty">${[["table", "🍽️ टेबल"], ["parcel", "🥡 पार्सल"], ["delivery", "🛵 डिलीवरी"]].map(([k, l]) => `<button data-ty="${k}" class="${TAKE.type === k ? "on" : ""}">${l}</button>`).join("")}</div>
  ${TAKE.type === "table" ? `<div class="tsel">${Array.from({ length: CFG.tables || 16 }, (_, k) => `<button data-tn="${k + 1}" class="${TAKE.table === k + 1 ? "on" : ""}">${k + 1}</button>`).join("")}</div>` : ""}<div id="menu"></div>`;
}
function bar() {
  const b = $("#bar"), L = cartLines(TAKE.cart), n = L.reduce((t, l) => t + l.q, 0);
  b.hidden = !(TAB === "take" && n); if (!b.hidden) b.innerHTML = `<span>${n} डिश · ${rs(cartTotal(TAKE.cart))}</span><span>ऑर्डर देखें ›</span>`;
}
function review() {
  const L = cartLines(TAKE.cart); if (!L.length) return;
  if (TAKE.type === "table" && !TAKE.table) return toast("पहले टेबल चुनें");
  const b = sheet(`<h3>${where(TAKE)} — ऑर्डर पक्का करें</h3><div class="kot">${L.map(l => `<div><b>${l.q}×</b>${vmark(l.veg)}${E(title(l.n))}<span>${rs(l.q * l.s)}</span></div>`).join("")}</div>
  ${TAKE.type !== "table" ? `<input class="in" id="cn" placeholder="ग्राहक का नाम"><input class="in" id="cp" inputmode="numeric" maxlength="10" placeholder="मोबाइल नंबर">${TAKE.type === "delivery" ? `<input class="in" id="ca" placeholder="पता / क्वार्टर">` : ""}` : ""}
  <input class="in" id="nt" placeholder="नोट (कम तीखा, बिना प्याज़…)" value="${E(TAKE.note)}">
  <button class="btn ok big" id="send">✅ रसोई को भेजें · ${rs(cartTotal(TAKE.cart))}</button>`);
  $("#send", b).onclick = () => {
    const o = { kind: "order", type: TAKE.type, table: TAKE.type === "table" ? TAKE.table : 0, items: L, total: cartTotal(TAKE.cart), note: $("#nt", b).value.trim(), by: ME.name,
      name: ($("#cn", b) || {}).value || "", phone: (($("#cp", b) || {}).value || "").replace(/\D/g, ""), addr: ($("#ca", b) || {}).value || "" };
    if (TAKE.type === "delivery" && !o.addr) return toast("पता लिखें");
    o.status = "acc"; o.eta = (CFG.prep || [25])[1] || 25; /* वेटर का लिया ऑर्डर सीधा स्वीकार — घंटी नहीं */
    $("#send", b).disabled = true;
    DB.add(o).then(() => { TAKE = { type: TAKE.type, table: 0, cart: {}, note: "" }; closeSheet(); toast("ऑर्डर रसोई में गया ✔"); TAB = "orders"; draw() }).catch(e => { $("#send", b).disabled = false; toast("नहीं गया — नेट देखें") });
  };
}
function vMore() {
  const T = todays().filter(o => o.kind !== "call"), ok = T.filter(o => o.status !== "rej"), acc = T.filter(o => o.by === "customer" && (o.log || []).some(l => l.s === "acc"));
  const avg = acc.length ? Math.round(acc.reduce((t, o) => t + ((o.log.find(l => l.s === "acc").ts - o.ts) / 1000), 0) / acc.length) : 0;
  const esc = T.filter(o => o.by === "customer" && ((o.log || []).find(l => l.s !== "new") || { ts: now() }).ts - o.ts > WAIT).length;
  return `<div class="h">📊 आज</div><div class="sum"><div><b>${ok.length}</b><small>ऑर्डर</small></div><div><b>${rs(ok.reduce((t, o) => t + o.total, 0))}</b><small>कुल</small></div><div><b>${avg ? avg + "s" : "—"}</b><small>औसत स्वीकार-समय</small></div></div>
  ${ME.role === "owner" ? `<div class="row" style="margin-top:8px">⏱ ${Math.round(WAIT / 60000)} मिनट से देर वाले ऑर्डर (मालिक तक पहुँचे): <b style="margin-left:auto">${esc}</b></div><div class="row">🧾 बिना TMBill नंबर के पूरे ऑर्डर: <b style="margin-left:auto">${T.filter(o => o.status === "done" && !o.tm).length}</b></div>` : ""}
  <div class="h">🏨 होटल का प्रबंध</div><button class="row" data-a="check">✅ चेकलिस्ट — सुबह / रात / हफ़्ते की</button><button class="row" data-a="assets">🪑 प्रॉपर्टी रजिस्टर — कुर्सी, टेबल, बर्तन…</button>
  ${["owner", "manager"].includes(ME.role) ? `<button class="row" data-a="udhar">💰 उधारी — किस पर कितना बाकी, WhatsApp याद</button>` : ""}
  ${ME.role === "owner" ? `<button class="row" data-a="cust">👥 ग्राहक — VIP, वापस बुलाएँ, उधारी, WhatsApp</button><button class="row" data-a="map">🗺️ टीम कहाँ है — नक्शा और आज का रास्ता</button><button class="row" data-a="msg">📣 मैनेजर को संदेश भेजें (फोन पर अलार्म)</button><button class="row" data-a="code">🤖 Claude का कोड लगाएँ (उधारी / ग्राहक / सूची)</button>` : ""}
  <div class="h">🛠️ औज़ार</div><a class="row" href="qr.html" target="_blank">🖨️ टेबल के QR कार्ड छापें (${CFG.tables})</a><a class="row" href="t/?t=1" target="_blank">📱 ग्राहक का टेबल-पेज देखें (टेबल 1)</a>
  <button class="row" data-a="bell">🔔 घंटी की आवाज़ जाँचें</button>${DB.mode === "fs" ? (ME.role === "owner" ? `<button class="row" data-a="team">👥 टीम — मैनेजर/वेटर जोड़ें, मंज़ूरी दें</button>` : "") + `<button class="row" data-a="logout">🚪 ${E(ME.name)} · ${ROLES[ME.role]} — लॉगआउट</button>` : `<button class="row" data-a="login">👤 ${E(ME.name)} · ${ROLES[ME.role]} — बदलें</button>`}${DB.err ? `<div class="empty">⚠ ${E(DB.err)}</div>` : ""}`;
}
function onAct(e, after) {
  const a = e.target.closest("[data-a]"); if (!a) return false; const id = a.dataset.id, k = a.dataset.a;
  if (k === "sil") { pend().forEach(o => SIL[o.id] = 1); ring() }
  else if (k === "bell") { const P = NAT(); P ? P.ringTest().catch(() => BELL.beep()) : BELL.beep() } else if (k === "login") login(); else if (k === "team") return team(), true; else if (k === "check") return checkSheet(), true; else if (k === "assets") return assetsSheet(), true; else if (k === "map") return mapSheet(), true; else if (k === "udhar") return udharSheet(), true; else if (k === "code") return codeSheet(), true; else if (k === "cust") return custSheet(), true;
  else if (k === "msg") { const b = sheet(`<h3>📣 मैनेजर को संदेश</h3><textarea class="in" id="mt" rows="3" maxlength="190" placeholder="जैसे: शाम 7 बजे 20 लोगों की पार्टी है, तैयारी रखें"></textarea><button class="btn big" id="ms">भेजें — मैनेजर के फोन पर घंटी बजेगी</button>`); $("#ms", b).onclick = () => { const n = $("#mt", b).value.trim(); if (n.length < 3) return toast("संदेश लिखें"); DB.add({ kind: "call", call: "msg", type: "parcel", table: 0, by: ME.name, note: n }).then(() => { closeSheet(); toast("संदेश गया ✔"); TAB = "orders"; draw() }).catch(() => toast("नहीं गया — नेट देखें")) }; return true } else if (k === "logout") return logout(), true;
  else if (k === "acc") { const b = sheet(`<h3>✅ कितने मिनट में तैयार?</h3><div class="seg">${(CFG.prep || [15, 25, 35]).map(m => `<button data-m="${m}" style="flex:1">${m} मिनट</button>`).join("")}</div>`); b.onclick = x => { const m = x.target.closest("[data-m]"); if (m) { act(id, { status: "acc", eta: +m.dataset.m }); closeSheet(); (after || draw)() } }; return true }
  else if (k === "rej") { const b = sheet(`<h3>❌ मना करने का कारण</h3><div class="seg">${["डिश खत्म", "रसोई बंद", "बहुत भीड़", "ग्राहक ने रद्द किया"].map(r => `<button data-r="${r}">${r}</button>`).join("")}</div>`); b.onclick = x => { const r = x.target.closest("[data-r]"); if (r) { act(id, { status: "rej", why: r.dataset.r }); closeSheet(); (after || draw)() } }; return true }
  else if (k === "done" && (ALL.find(o => o.id === id) || {}).kind !== "call") { const b = sheet(`<h3>✔ पूरा — TMBill का बिल नंबर</h3><input class="in" id="tmn" inputmode="numeric" placeholder="TMBill बिल नं. (पक्का बिल वहीं बनता है)"><button class="btn ok big" id="tmo">पूरा करें</button>`); $("#tmo", b).onclick = () => { act(id, { status: "done", tm: $("#tmn", b).value.trim() }); closeSheet(); (after || draw)() }; return true }
  else if (id) act(id, { status: k });
  after && after(); return true;
}
function ring() { const n = pend().length, nb = $("#nb"); nb.hidden = !n; nb.textContent = n; BELL.set(!!ME && !NAT() && ringFor().length > 0) /* APK में असली अलार्म सेवा बजाती है */ }
/* ───── असली मोड (Firebase): मोबाइल + पिन से लॉगिन, मालिक की मंज़ूरी, टीम, APK की घंटी/लोकेशन ───── */
/* लॉगिन की ग़लती साफ़ हिंदी में + असली कोड (स्क्रीनशॉट से पता चले क्या अटका) */
const AERR = m => { m = String(m || ""); const t = /OPERATION_NOT_ALLOWED|ADMIN_ONLY/.test(m) ? "Firebase में Email/Password लॉगिन चालू नहीं है — Authentication → Sign-in method → Email/Password → Enable → Save"
  : /CONFIGURATION_NOT_FOUND/.test(m) ? "Firebase में Authentication शुरू नहीं हुई — Build → Authentication → Get started दबाएँ, फिर Email/Password चालू करें"
  : /TOO_MANY/.test(m) ? "बहुत बार ग़लत कोशिश — 10 मिनट बाद फिर करें" : /WEAK/.test(m) ? "पिन कम से कम 6 अंक का रखें" : /API key|API_KEY|blocked|referer/i.test(m) ? "Firebase की चाबी (API key) रोक रही है"
  : /Failed to fetch|NetworkError|Load failed/i.test(m) ? "इंटरनेट नहीं चल रहा — नेट देखकर फिर दबाएँ" : /PERMISSION|Missing or insufficient/i.test(m) ? "Firebase के नियम (Rules) रोक रहे हैं — नियम दोबारा चिपकाकर Publish करें" : "नहीं हुआ";
  return t + " · कोड: " + m.slice(0, 70) };
function fsLogin(msg) {
  const b = sheet(`<div class="lg"><img src="icon.png" alt=""><h3>Marwar Rasoi</h3><p>अपना मोबाइल नंबर और पिन डालें।<br>पहली बार आए हैं तो यही आपका नया पिन बन जाएगा।</p></div>
  <input class="in big" id="fp" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="मोबाइल नंबर (10 अंक)" value="${E(LS.get("mr_ph", ""))}">
  <input class="in big" id="fk" type="password" inputmode="numeric" autocomplete="current-password" placeholder="पिन (6 अंक या ज़्यादा)">
